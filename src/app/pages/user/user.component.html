<div class="container">
  <h1>My Tasks</h1>

  <div class="filters">
    <select [(ngModel)]="selectedStatus" (change)="loadTasks()">
      <option value="">All Statuses</option>
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Done">Done</option>
    </select>

    <select [(ngModel)]="selectedPriority" (change)="loadTasks()">
      <option value="">All Priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
  </div>

  <div class="task-card" *ngFor="let task of tasks">
    <h2>{{ task.title }}</h2>
    <p>{{ task.description }}</p>
    <p>Priority: {{ task.priority }}</p>
    <p>Deadline: {{ task.deadline | date }}</p>
    <p>Status: {{ task.status }}</p>

    <select [ngModel]="task.status" (ngModelChange)="updateStatus(task, $event)">
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Done">Done</option>
    </select>

    <hr>

    <h3>Comments</h3>
    <button (click)="loadComments(task.id)">Load Comments</button>

    <div *ngFor="let comment of comments[task.id]">
      <p>
        <strong>{{ comment.user?.fullName || 'User' }}</strong>
        {{ comment.content }}
      </p>
      <small>{{ comment.createdAt | date:'medium' }}</small>
    </div>

    <textarea [(ngModel)]="commentText[task.id]" placeholder="Write a comment..."></textarea>
    <button (click)="addComment(task.id)">Add Comment</button>
  </div>
</div>
