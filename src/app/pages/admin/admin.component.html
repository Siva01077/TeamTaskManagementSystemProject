<div class="container">
  <h1>Admin Panel</h1>

  <section>
    <h2>User Management</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Team</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>
            <select [ngModel]="user.role" (ngModelChange)="changeRole(user, $event)">
              <option value="User">User</option>
              <option value="Manager">Manager</option>
              <option value="Admin">Admin</option>
            </select>
          </td>
          <td>{{ user.team?.name || 'No Team' }}</td>
          <td>
            <button (click)="deleteUser(user)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Create Team</h2>
    <input [(ngModel)]="newTeamName" placeholder="Team name">
    <button (click)="createTeam()">Create Team</button>
  </section>
</div>
